[package]
name = "resona"
version = "0.3.1"
edition = "2024"

[dependencies]
librespot = "0.8"
env_logger = "0.11"
log = "0.4"
librespot-oauth = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.33", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.8", default-features = false }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
unicode-width = "0.2"
protobuf = "3"

# The menu bar, the cursor fix and the Dock icon talk to AppKit directly.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor", "NSApplication", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
# The terminal player turns the main run loop by hand, which is where Now Playing delivers media keys.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFDate"] }

# Media keys on Linux go over D-Bus (MPRIS); zbus is pure Rust, so no libdbus to install.
# The terminal player's hangup watcher (`cli::quit_on_hangup`); already in the tree through tokio and crossterm.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[profile.release]
lto = "thin"
strip = true

# ponytail: block 0.1.6 (via souvlaki and cocoa) has an extern static of an empty enum, a future Rust error;
# our copy makes it an opaque struct. Drop it once souvlaki moves off block 0.1.
[patch.crates-io]
block = { path = "patches/block" }
