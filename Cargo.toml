[package]
name = "resona"
version = "0.1.0"
edition = "2024"

[dependencies]
librespot = "0.8"
env_logger = "0.11"
librespot-oauth = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.33", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
souvlaki = { version = "0.8", default-features = false }
muda = "0.21"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
unicode-width = "0.2"
protobuf = "3"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
serde_json = "1"
