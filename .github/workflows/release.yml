name: release

# Pushing a tag like v0.2.0 makes a GitHub release with ready-made builds: a universal Resona.app for the Mac
# (what install.sh downloads), and plain binaries for Linux and Windows.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Resona $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The write token goes only to the upload step, never to the build or the third-party actions (pinned to commits).
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux libraries (audio, TLS)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Build without the token (dependencies' build scripts run here), then upload with it.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./bundle.sh dist && mkdir dist && mv target/Resona-macos.zip dist/
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release && mkdir dist && tar -czf dist/resona-linux-x86_64.tar.gz -C target/release resona
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          mkdir dist
          Compress-Archive target/release/resona.exe dist/resona-windows-x86_64.zip
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*
